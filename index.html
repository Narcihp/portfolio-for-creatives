<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Portfolio Holding Page</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: #F7F3E9;
        margin: 0;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
      }

      svg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }

      line {
        stroke: #2E2E2E;
        stroke-width: 1.2;
        stroke-linecap: round;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      #scroll-text {
        position: fixed;
        bottom: 350px;
        width: 100%;
        text-align: center;
        color: #2E2E2E;
        font-size: 1.2rem;
        letter-spacing: 2px;
        opacity: 0.8;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%   { opacity: 0.3; transform: translateY(0); }
        50%  { opacity: 1;   transform: translateY(6px); }
        100% { opacity: 0.3; transform: translateY(0); }
      }

      .holding-page-footer {
        position: fixed;
        bottom: 10px;
        width: 100%;
        text-align: center;
        color: #777;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <!-- Heart -->
    <svg viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg">
      <g id="heart"></g>
    </svg>

    <!-- Scroll instruction -->
    <div id="scroll-text">Scroll to Reveal</div>
    <div style="height:300vh"></div>

    <!-- Footer -->
    <div class="holding-page-footer">
      <p>© 2024 - 2026 Narci - All Rights Reserved</p>
    </div>

    <script>
      const g = document.getElementById("heart");

      function heartPoint(t) {
        const x = 16 * Math.sin(t) ** 3;
        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);
        return [x * 15, -y * 15];
      }

      const steps = 360;
      const points = [];
      for (let i = 0; i < steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        points.push(heartPoint(t));
      }

      const lines = [];
      for (let i = 0; i < steps; i++) {
        const [x1, y1] = points[i];
        const [x2, y2] = points[(i + steps / 2) % steps];
        const line = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        g.appendChild(line);
        lines.push(line);
      }

      let redirected = false;

      function revealOnScroll() {
        const max =
          document.documentElement.scrollHeight - window.innerHeight;
        const progress = Math.min(1, Math.max(0, window.scrollY / max));
        const showCount = Math.floor(progress * steps);

        lines.forEach((line, i) => {
          line.style.opacity = i < showCount ? 1 : 0;
        });

        const scrollText = document.getElementById("scroll-text");
        if (scrollText) {
          scrollText.style.display = window.scrollY > 50 ? "none" : "block";
        }

        // when heart is fully revealed, trigger redirect after 1s
        if (!redirected && showCount >= steps) {
          redirected = true;
          setTimeout(() => {
            window.location.href = "work.html";
          }, 1000); // 1 second delay
        }
      }

      window.addEventListener("scroll", revealOnScroll);
      revealOnScroll();
    </script>
  </body>
</html>
